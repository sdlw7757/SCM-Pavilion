name: 抓取数据并部署

on:
  push:
    branches:
      - main
      - master
  schedule:
    # 每天 UTC 16:00 = 北京时间 0:00 运行一次
    - cron: '0 16 * * *'
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'winorigin-bot'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行数据抓取脚本
        id: scrape
        run: |
          python scripts/scraper.py
          if [ ! -f data/meta.json ]; then
            echo "::warning file=scripts/scraper.py,title=爬虫完全失败::meta.json 不存在，所有数据源均不可用"
            echo "has_data=false" >> $GITHUB_OUTPUT
          else
            TOTAL=$(python3 -c "import json; print(json.load(open('data/meta.json'))['totalProducts'])")
            if [ "$TOTAL" -eq 0 ] 2>/dev/null; then
              echo "::warning file=scripts/scraper.py,title=无有效数据::totalProducts=0，爬虫未获取到任何产品"
              echo "has_data=false" >> $GITHUB_OUTPUT
            else
              echo "has_data=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 数据抓取失败告警
        if: steps.scrape.outputs.has_data == 'false'
        run: |
          echo "::warning::数据抓取失败或无有效数据，跳过部署。网站将显示上次成功抓取的数据。"

      - name: 更新时间戳
        if: steps.scrape.outputs.has_data == 'true'
        run: python scripts/update_timestamp.py

      - name: 提交并推送数据更新
        if: steps.scrape.outputs.has_data == 'true'
        run: |
          git config user.name "winorigin-bot"
          git config user.email "bot@winorigin.github.io"
          git add data/
          git diff --cached --quiet || git commit -m "bot: 自动抓取更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') [skip ci]"
          n=0; until [ "$n" -ge 3 ]; do git push && break; n=$((n+1)); echo "推送失败，第${n}次重试..."; sleep 5; done

      - name: 部署到 gh-pages 分支
        if: steps.scrape.outputs.has_data == 'true'
        run: |
          DEPLOY_DIR=$(mktemp -d)
          for f in assets css js pages data index.html sitemap.xml robots.txt _headers; do
            [ -e "$f" ] && cp -r "$f" "$DEPLOY_DIR/"
          done
          cd "$DEPLOY_DIR"
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git config user.name "winorigin-bot"
          git config user.email "bot@winorigin.github.io"
          git add -A
          git commit -m "deploy: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          n=0; until [ "$n" -ge 3 ]; do git push origin HEAD:gh-pages --force && break; n=$((n+1)); echo "部署推送失败，第${n}次重试..."; sleep 5; done

      - name: 推送新内容到百度
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        if: steps.scrape.outputs.has_data == 'true' && env.BAIDU_TOKEN != ''
        run: |
          if [ ! -f sitemap.xml ]; then
            echo "sitemap.xml not found, skip baidu push"
            exit 0
          fi

          # 1) 取出 sitemap 中的全部 URL（规范地址，无 .html 后缀）
          ALL=$(python3 -c "
          import xml.etree.ElementTree as ET
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          try:
              urls = [e.text for e in ET.parse('sitemap.xml').findall('.//sm:url/sm:loc', ns)]
              print('\n'.join(urls))
          except Exception:
              print('')
          ")
          if [ -z "$ALL" ]; then
            echo "No urls found in sitemap.xml, skip baidu push"
            exit 0
          fi

          # 2) 过滤掉已经推送过的 URL（记录保存在仓库根目录 pushed_urls.txt）
          if [ ! -f pushed_urls.txt ]; then touch pushed_urls.txt; fi
          NEW=$(comm -23 <(printf "%s\n" "$ALL" | sort -u) <(sort -u pushed_urls.txt))
          if [ -z "$NEW" ]; then
            echo "没有新的 URL 需要推送，跳过"
            exit 0
          fi

          # 3) 百度普通收录接口每日配额有限（通常 10 条/天），必须分批推送，
          #    并根据接口返回的 remain 判断是否继续，超配额时用 -f 让 curl 报错（不再静默失败）
          BATCH=10
          PUSHED=""
          i=0
          while :; do
            CHUNK=$(printf "%s\n" "$NEW" | awk -v s="$((i+1))" -v e="$((i+BATCH))" 'NR>=s && NR<=e')
            [ -z "$CHUNK" ] && break
            RESP=$(curl -sS -f -k -H "Content-Type: text/plain" --data "$CHUNK" \
              "https://data.zz.baidu.com/urls?site=https://517757.xyz&token=$BAIDU_TOKEN") || {
                echo "::error::百度推送失败 (批次 $((i/BATCH+1)))，接口返回非 2xx，请检查 BAIDU_TOKEN 是否配置正确、当日配额是否用尽"
                break
              }
            echo "batch $((i/BATCH+1)): $RESP"
            REMAIN=$(printf "%s" "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('remain',0))" 2>/dev/null || echo 0)
            PUSHED=$(printf "%s\n%s" "$PUSHED" "$CHUNK")
            [ "$REMAIN" -le 0 ] && { echo "百度当日配额已用完，停止推送"; break; }
            i=$((i+BATCH))
          done

          # 4) 把本次成功提交的 URL 追加到 pushed_urls.txt，避免以后重复推送浪费配额
          if [ -n "$PUSHED" ]; then
            printf "%s\n" "$PUSHED" | sed '/^$/d' | sort -u >> pushed_urls.txt
            sort -u pushed_urls.txt -o pushed_urls.txt
            if [ -n "$(git status --porcelain pushed_urls.txt)" ]; then
              git config user.name "winorigin-bot"
              git config user.email "bot@winorigin.github.io"
              git add pushed_urls.txt
              git commit -m "bot: 更新百度已推送 URL 记录 [skip ci]"
              n=0; until [ "$n" -ge 3 ]; do git push && break; n=$((n+1)); echo "推送记录提交失败，第${n}次重试..."; sleep 5; done
            fi
          else
            echo "本次没有成功推送任何 URL（配额已用完或推送失败）"
          fi
